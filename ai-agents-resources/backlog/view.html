<style>
:root {
	--background: #fef9f4;
	--surface: #ffffff;
	--text: #3a2e26;
	--muted: #7a6558;
	--border: #ecdfd2;
	--accent: #d9770b;
	--stripe: #fbf2ea;
	--hover: #f8eadc;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--background: #2f2620;
		--surface: #372d26;
		--text: #f7ecdf;
		--muted: #cdb8a4;
		--border: #5a4a3e;
		--accent: #f0a060;
		--stripe: #3d332b;
		--hover: #463c33;
	}
}
:root[data-theme="dark"] {
	--background: #2f2620;
	--surface: #372d26;
	--text: #f7ecdf;
	--muted: #cdb8a4;
	--border: #5a4a3e;
	--accent: #f0a060;
	--stripe: #3d332b;
	--hover: #463c33;
}
body {
	margin: 0;
	padding: 16px;
	background: var(--background);
	color: var(--text);
	font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}
h1 { font-size: 22px; margin: 0 0 14px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.tab {
	padding: 10px 16px;
	border: none;
	border-bottom: 3px solid transparent;
	background: none;
	color: var(--muted);
	font: inherit;
	cursor: pointer;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.filters {
	display: flex;
	flex-wrap: wrap;
	gap: 10px;
	margin-bottom: 14px;
}
.filters label { display: flex; flex-direction: column; color: var(--muted); font-size: 13px; }
select, input {
	margin-top: 3px;
	padding: 6px 10px;
	border: 1px solid var(--border);
	border-radius: 8px;
	background: var(--surface);
	color: var(--text);
	font: inherit;
	min-width: 120px;
}
select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.count { color: var(--muted); margin: 6px 0 12px; font-size: 13px; }
.table-wrap { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
th {
	position: sticky;
	top: 0;
	z-index: 1;
	background: var(--surface);
	color: var(--muted);
	font-weight: 600;
	font-size: 13px;
	white-space: nowrap;
}
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text); }
tr:last-child td { border-bottom: none; }
tbody tr:nth-child(even) { background: var(--stripe); }
tbody tr.entry { cursor: pointer; }
tbody tr.entry:hover { background: var(--hover); }
tr.details td { white-space: normal; }
.id { font-family: ui-monospace, Menlo, monospace; white-space: nowrap; color: var(--muted); font-size: 13px; }
.pill {
	display: inline-block;
	margin: 2px 5px 2px 0;
	padding: 2px 9px;
	border-radius: 999px;
	font-size: 12.5px;
	font-weight: 600;
	white-space: nowrap;
	color: var(--pill);
	background: color-mix(in srgb, var(--pill) 18%, transparent);
}
button.pill { border: none; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
button.pill:hover { outline: 1px solid var(--pill); }
.pill[role="button"] { cursor: pointer; }
.toggle { display: inline-block; width: 1.2em; color: var(--muted); }
td.meta-title { font-weight: 700; }
.progress { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; vertical-align: middle; }
.progress-track { display: inline-block; width: 90px; height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; }
.progress-fill { display: block; height: 100%; background: #2e9e4f; }
.progress-label { color: var(--muted); font-size: 13px; white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
button.action {
	padding: 5px 14px;
	border: 1px solid var(--border);
	border-radius: 8px;
	background: var(--surface);
	color: var(--text);
	font: inherit;
	cursor: pointer;
}
button.action:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button.action:disabled { opacity: 0.45; cursor: default; }
.action-message { color: var(--muted); font-size: 13px; }
dl.details { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
dl.details dt { color: var(--muted); font-size: 13px; }
dl.details dd { margin: 0; white-space: pre-wrap; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
@media (max-width: 600px) {
	.table-wrap { overflow-x: auto; }
	.filters label, select, input { min-width: 0; width: 100%; }
	.filters label { flex: 1 1 140px; }
}

he 0.1.0 cache shows the shape change.", "upstream": "no", "next step": "Test the hypothesis by setting `shape: 'tasks-1'` (keeping numbering) and checking whether the pane returns. If it does, the host does not support tasks-2.", "tags": "Claude", "priority": "medium", "difficulty": "easy", "guessed": "Tags, Priority, Difficulty"}, {"id": "A-018", "title": "Methods compiled through the Pharo MCP keep lf line endings", "source": "Claude tasks", "archived": false, "status": "open", "area": "`pharo` MCP, `image_evaluate` and `method_compile`", "type": "improvement", "found": "2026-11-11, Claude Code", "summary": "Source sent from an agent has lf line endings, but Pharo stores method source with cr. Nothing converts or warns, so methods compiled through the MCP silently end up with lf until someone notices (the user did).", "evidence": "`SycPackageExtraCommand>>#order` compiled with `cls compile: 'order\\n\\t^ 10100'` kept `Character lf` in `sourceCode`; fixed by recompiling `ast formattedCode copyReplaceAll: String lf with: String cr`.", "upstream": "yes", "next step": "Make the MCP compile tools convert lf to cr (and optionally apply the formatter), or report lf in the tool result.", "tags": "Pharo", "priority": "medium", "difficulty": "easy", "guessed": "Tags, Priority, Difficulty"}, {"id": "A-019", "title": "`compile:classified:` and `protocol` answer unexpected types in Pharo 15", "source": "Claude tasks", "archived": false, "status": "open", "area": "`pharo` MCP `image_evaluate` usage, Pharo 15 `Behavior>>#compile:classified:`, `CompiledMethod>>#protocol`", "type": "doc", "found": "2026-11-11, Claude Code", "summary": "`compile:classified:` answers the selector (a Symbol), not the CompiledMethod, and `protocol` answers a `Protocol` object, not a String. Agents that chain `(cls compile: src) selector` or pass `method protocol` as a category name fail with DNU.", "evidence": "`ByteSymbol DNU #selector` after `cls compile: src classified: proto`; `proto` printed as `Protocol (testing) - 3 selector(s)`.", "upstream": "unknown", "next step": "Document this in the MCP templates (`Evref-BL/MCP/templates`) or offer a compile tool that answers the method and accepts a protocol name.", "tags": "Pharo", "priority": "low", "difficulty": "easy", "guessed": "Tags, Priority, Difficulty"}, {"id": "A-020", "title": "Calypso shortcuts bound to several commands run an image-dependent one", "source": "Claude tasks", "archived": false, "status": "open", "area": "`pharo-project/pharo` Calypso, `ClyKMDispatcher>>#dispatch:`, `ClassAnnotation class>>#createContainerForRegistry`", "type": "bug", "found": "2026-11-11, Claude Code", "summary": "In the method pane, ⌘T is active for `ClyRunCoveringTestMethodsCommand`, `SycOpenDebuggingPointsInMethodMenuCommand` and `SycOpenMethodMenuCommand`, all with priority 0. In text editors, ⌘E ⌘M is active for `SycExtractMethodAndOccurrencesCommand` and `SycExtractMethodCommand`. The dispatcher runs the first registered one, and the registry sorts only by priority, so which command runs depends on the order annotations were collected in that image. The method menu shows ⌘T next to three entries.", "evidence": "`ClyFullBrowserCommandPlacementTest>>#paneShortcuts` and `#textEditorShortcuts` snapshots (package `Calypso-SystemTools-CommandPlacement-Tests`); `ClyShortcutActivation registeredInstances` priorities: 75 at 0, 1 at 100000.", "upstream": "yes", "next step": "Decide which command owns each key and remove or rebind the others; the new registration (U-023 plan) can make conflicts visible or forbid them.", "tags": "Pharo, Calypso", "priority": "low", "difficulty": "easy", "guessed": "Tags, Difficulty"}, {"id": "A-021", "title": "`method_compile` rejects a single `source` string written with escaped line breaks", "source": "Claude tasks", "archived": false, "status": "open", "area": "`pharo` MCP `method_compile`", "type": "friction", "found": "2026-11-11, Claude Code", "summary": "Passing `source` as one string containing `\\r\\t` escapes failed with \"Variable or expression expected\", while the same text inside a one-element array compiled correctly with cr line endings. Agents must know to use the array form.", "evidence": "`method_compile` class `ClyCommandPlacementFixture`, side class, `source: \"fixtureClassMethod\\r\\r\\t^ self new\"` → `Unable to compile method on ClyCommandPlacementFixture class: Variable or expression expected`; `source: [\"fixtureClassMethod\\r\\r\\t^ self new\"]` → created.", "upstream": "unknown", "next step": "Check whether the string form reaches the image with literal backslashes (client or server side) and either decode it the same way as the array form or document the array form in the tool description.", "tags": "MCP", "priority": "low", "difficulty": "easy", "guessed": "Tags, Priority, Difficulty"}, {"id": "A-022", "title": "test_run over many UI test packages fails with Break or drops the MCP connection", "source": "Claude tasks", "archived": false, "status": "open", "area": "`pharo` MCP `test_run`; `DebugPoints-Tests` in `pharo-project/pharo`", "type": "bug", "found": "2026-11-12, Claude Code", "summary": "Running 12 packages at once (Calypso, SystemCommands, ClassAnnotation and DebugPoints tests) answered \"Unable to run tests: ... (Break):\" and left BreakDebugPoint metalinks on `DummyTestClass`; the retry closed the socket (ECONNRESET) and the MCP had to be restarted. The same packages pass when run in groups of 2 to 7. The leftover links then make `DebugPoints-Tests` fail alone, and `MetaLink uninstallAll` fails because the installer still lists dead anonymous subclasses of `DummyTestClass`.", "evidence": "`test_run` packages [12 packages incl. DebugPoints-Tests] → `(Break)`, then `ECONNRESET`; `MetaLinkInstaller>>propagateLinkRemoval:forNode:` → `nil DNU removeLink:`. Workaround: remove `DummyTestClass` from the anonymous class builder's `classes` and `migratedObjects`, uninstall the links, recompile `DummyTestClass>>#initialize`.", "upstream": "unknown", "next step": "Check whether `test_run` runs big suites in a way that lets a `Break` escape (DebugPoints tests catch it themselves), and make `MetaLinkInstaller` skip anonymous subclasses whose instance is gone.", "tags": "MCP, Pharo", "priority": "medium", "difficulty": "medium", "guessed": "Tags, Priority, Difficulty"}, {"id": "A-023", "title": "Calypso \"Breakpoints\" (⇧⌘G), \"Debugging\" (⇧⌘H) and \"Reflectivity\" menus had lost their commands", "source": "Claude tasks", "archived": false, "status": "open", "area": "`pharo-project/pharo` Calypso source code menus (former SycOpenDebuggingMenuCommand, SycOpenAdvancedDebuggingMenuCommand, SycOpenReflectivityMenuCommand)", "type": "bug", "found": "2026-11-12, Claude Code", "summary": "No command was annotated for SycDebuggingMenuActivation, SycAdvancedDebuggingMenuActivation or SycReflectivityMenuActivation any more, so ⇧⌘G and ⇧⌘H in code editors only showed \"Format code\" and \"Inspect AST Node\" (picked up from the SycSourceCodeCmCommand family), and the Reflectivity menu could never be shown. The commands meant for them (probably the Reflectivity plugin debugging commands) were lost, likely during the Commander1 to Commander2 migration. With the user's agreement the three menus and the two shortcuts were removed in the command registration rework (U-023).", "evidence": "snapshot `openedMenus` before the change: \"method editor, Shift+Meta+G: Format code / Inspect AST Node OCVariableNode\"; annotations of the three strategies: none.", "upstream": "yes", "next step": "Decide which debugging commands these menus should hold, declare them in a menu group with `<calypsoCommands>` and bind ⇧⌘G / ⇧⌘H again with `addMenuOf:key:`.", "tags": "Pharo, Calypso", "priority": "medium", "difficulty": "medium", "guessed": "Tags, Priority, Difficulty"}, {"id": "A-024", "title": "FASTTypeScriptImporterTest has 7 failing tests", "source": "Claude tasks", "archived": false, "status": "open", "area": "`moosetechnology/FASTTypescript`, `FASTTypeScriptImporterTest`", "type": "bug", "found": "2026-11-10, Claude Code", "summary": "Seven generated regression tests fail with \"Got 1 instead of 2.\" They also fail with the pre-fix `TSFASTContextEntry>>fieldMatchesProperty:`, so the alias fix (A-014) is not the cause.", "evidence": "`FASTTypeScriptImporterTest buildSuite run` gives `112 ran, 105 passed, 7 failures`. Failing: testGeneratedOverrideModifier, testGeneratedAmbientDeclarations, testGeneratedSuper, testGeneratedGenericTypes, testGeneratedClassesWithGenericParameters, testGeneratedClassesWithMethodsWithAndWithoutTrailingSemicolonsOnOneLine, testGeneratedClassesWithExtensions.", "upstream": "yes", "next step": "Check whether these tests passed on `main` before the July Pharo-Tree-Sitter commits, then regenerate or fix them.", "tags": "Moose", "priority": "low", "difficulty": "medium", "guessed": "Tags, Priority, Difficulty"}, {"id": "A-026", "title": "Image-only work reported as done was lost after reloading the project", "source": "Claude tasks", "archived": false, "status": "open", "area": "`Evref-BL/Pharo-Tree-Sitter` (`TSFASTVisitor>>import:into:`, `TSFASTAbstractImporter>>parse:into:`, `FASTTImporter` on the abstract importer), `Evref-BL/FAST-YAML` (`TreeRepresentation`)", "type": "friction", "found": "2026-11-12, Claude Code", "summary": "Model reuse and the trait usage were made in the image only and reported as committed. After the user reloaded the project, `import:into:`, `parse:into:` and the trait were missing from the image and from `main`. The FAST-Python test `testParseIntoAnExistingModelAddsTheNewSourceToIt` (merged) and the `handlesFile:` tests of the importers now fail.", "evidence": "`TSFASTVisitor includesSelector: #import:into:` → `false`; `FASTPythonImporterTest buildSuite run` → `4 errors` (`parse:into:`, `handlesFile:`); `git grep import:into src` in Pharo-Tree-Sitter → nothing.", "upstream": "no", "next step": "Commit image changes right after icHermesTool` and `HermesClapCommand`. The export used by the bootstrap is not affected. The repository's CI only runs Pharo 10 to 12.", "evidence": "Pharo 14 dumps of Hermes are identical to Pharo 10 ones (scratchpad p10/p14 Hermes.txt); `git grep 'addAndClassifySelector: selector withMethod:' v14.0.0 -- src` → nothing; `.github/workflows/continuous.yml` matrix Pharo64-10..12.", "upstream": "yes", "next step": "Sync the repository's Hermes and Hermes-Extensions with Pharo's and add Pharo 13, 14 and 15 to the CI matrix.", "tags": "Pharo, Hermes, Bootstrap", "priority": "medium", "difficulty": "medium", "guessed": "Tags, Priority, Difficulty"}, {"id": "A-030", "title": "Bootstrap dependencies have problems independent of the Pharo 14 migration", "source": "Claude tasks", "archived": false, "status": "open", "area": "`guillep/espell`, `pharo-project/pharo` Ring-Core, `pharo-project/pharo-vm` branch pharo-10, `pharo-project/pharo` PharoBootstrap", "type": "bug", "found": "2026-11-14, Claude Code", "summary": "Espell has 12 methods with undeclared variables (already in Pharo 10); `EPRemoteClass>>bindingOf:` sends `ifNotNilDo:` (not understood in Pharo 10 either) and fails on a nil superclass; `EPCompilationRequestor>>bindingOf:` raises KeyNotFound instead of answering nil. Ring-Core's `RGVariable` lacks `isSelfVariable`, `isSelfOrSuperVariable`, `isThisContextVariable` and `isThisProcessVariable`, sent by the Pharo 14/15 compiler. pharo-vm `pharo-10` uses `RB*` AST names in `VMMakerCompatibilityForPharo6`. `PBBootstrap>>bootstrap` replaces `Object>>assert:` with a no-op and an ensure block restores it, which does not run if the process is suspended while debugging.", "evidence": "found while porting the bootstrap to a Pharo 14 host (session of 2026-11-13/14).", "upstream": "yes", "next step": "One branch per project: espell `fix/undeclared-and-bindings`, pharo `fix/ring-variable-protocol`.", "tags": "Pharo, Bootstrap", "priority": "low", "difficulty": "medium", "guessed": "Tags, Priority, Difficulty"}, {"id": "A-005", "title": "Nested git repo broke GitKraken staging (resolved)", "source": "Archive", "archived": true, "status": "done", "resolved": "2026-11-10", "area": "`ai-agents-resources/`, GitKraken", "type": "friction", "found": "2026-11-10, Claude Code", "summary": "A `git init` inside the pharo repo made GitKraken fail when staging, with `does not have a commit checked out`. The nested `.git` was removed, so the folder is now plain files tracked by the pharo repo.", "evidence": "`~/.gitkraken/error-log.txt`, entry dated Tue Nov 10 2026 18:09", "upstream": "no", "next step": "none. Avoid nested repos unless intended."}, {"id": "A-003", "title": "Pharo repo still tracks AGENTS.md", "source": "Archive", "archived": true, "status": "done", "resolved": "2026-11-10", "area": "`~/Library/Preferences/pharo` git repo", "type": "friction", "found": "2026-11-10, Claude Code", "summary": "`AGENTS.md` was moved to `ai-agents-resources/`, but the pharo repo still tracks it, so it shows as deleted (` D AGENTS.md`).", "evidence": "`git -C ~/Library/Preferences/pharo status --short`", "upstream": "no", "next step": "None. AGENTS.md is now tracked only under ai-agents-resources/ (commit a0e43c6a renamed it)."}, {"id": "A-004", "title": "Pharo repo origin is an upstream project", "source": "Archive", "archived": true, "status": "done", "resolved": "2026-11-10", "area": "`~/Library/Preferences/pharo` git remote", "type": "security", "found": "2026-11-10, Claude Code", "summary": "The pharo repo's `origin` is `jecisc/pharo-scripts`, not a repo you own. Committing `ai-agents-resources/` there would push it to that remote.", "evidence": "`git -C ~/Library/Preferences/pharo remote -v`", "upstream": "unknown", "next step": "None. Owner confirmed the remote is theirs."}, {"id": "U-022", "title": "Deprecate v1", "source": "Archive", "archived": true, "status": "done", "resolved": "2026-11-10", "group": "Commander", "details": "unknown"}, {"id": "U-026", "title": "Theming", "source": "Archive", "archived": true, "status": "done", "resolved": "2026-11-10", "group": "Telescope Bloc", "details": "unknown"}, {"id": "A-015", "title": "Text replacement inserted the fix twice", "source": "Archive", "archived": true, "status": "done", "area": "agent workflow, Pharo method editing", "type": "bug", "found": "2026-11-10, Claude Code", "summary": "A `copyReplaceAll:` on method source matched two places (`pName :=` and `propName :=`), so the alias check ran for every field. It produced the 400 remaining failures. Fixed by rewriting the whole method.", "evidence": "`FASTPythonImporterTest suite run` → `400 failures` before the rewrite, `1816 passed` after.", "upstream": "no", "resolved": "2026-11-10", "next step": "Check the number of matches before any `copyReplaceAll:` on source."}, {"id": "A-016", "title": "Utilities bar keeps a stale MCP panel", "source": "Archive", "archived": true, "status": "done", "resolved": "2026-11-10", "area": "`jecisc/pharo-scripts`, `PharoMCPServersUtility` / `PharoMCPServersPresenter`", "type": "bug", "found": "2026-11-10, Claude Code", "summary": "The bar builds each panel once. A panel built before MCP loaded kept showing \"MCP is not loaded\". Fixed in the image (refresh on display, refresh button, context menu), but the user's bar still showed the old panel until it was rebuilt.", "evidence": "`UtilitiesBarMorph` panel layout `SpBoxLayout` with `SpListPresenter` only after rebuild.", "upstream": "yes", "next step": "unknown. Overwritten by mistake on 2026-11-10 when the status-line finding was closed. Restore the original."}, {"id": "A-008", "title": "Line feeds in compiled Pharo methods", "source": "Archive", "archived": true, "status": "done", "area": "agent workflow, Pharo `compile:` with literal strings", "type": "friction", "found": "2026-11-10, Claude Code", "summary": "Two methods written as literal strings in a compile call kept line feeds. The user noticed in the Python package.", "evidence": "`FASTPythonImporterTest>>testHandlesPythonFiles` and `FASTPythonImporter class>>extensions` contained `Character lf` until recompiled.", "upstream": "no", "resolved": "2026-11-10", "next step": "Check every compiled method for `Character lf` before reporting work as done."}, {"id": "A-012", "title": "Status line MCP segment never verified", "source": "Archive", "archived": true, "status": "done", "resolved": "2026-11-10", "area": "`ai-agents-resources/claude/statusline-command.sh`, lines 37–54", "type": "friction", "found": "2026-11-10, Claude Code", "summary": "The MCP segment reads `.mcp_servers` or `.mcp.servers` from the status line JSON. Nothing confirms Claude Code sends either field. The `2>/dev/null` hides any error, so if the field is missing the segment is silently skipped (likely dead code).", "evidence": "script lines 37–41; no sample of the status line input has been captured.", "upstream": "no", "next step": "none. The MCP segment was removed because it never displayed."}, {"id": "A-014", "title": "Pharo-Tree-Sitter regression broke aliases of unnamed children", "source": "Archive", "archived": true, "status": "done", "area": "`Evref-BL/Pharo-Tree-Sitter`, `TSFASTContextEntry>>fieldMatchesProperty:` (commits `2b4fc2b`, `5b09c81`)", "type": "bug", "found": "2026-11-10, Claude Code", "summary": "The unnamed-child branch returned before checking `aliasUnnamedFieldAs:` aliases. FAST-Python then failed 1810 of 1816 importer tests. Fixed in the image with `TSFASTContextEntryTest`, not yet committed.", "evidence": "`FASTPythonImporterTest suite run` → `1816 ran, ..., 1810 failures` before the fix, `1816 passed` after.", "upstream": "yes", "next step": "Commit the fix in Pharo-Tree-Sitter `main`, then mark this done.", "resolved": "2026-11-13"}, {"id": "A-007", "title": "Task list numbers lost in a new session, plugin copies differ", "source": "Archive", "archived": true, "status": "done", "area": "`~/.claude/my-mods/task-list`, `~/.claude/plugins/cache/cyril-mods/task-list/0.1.0`", "type": "bug", "found": "2026-11-10, Claude Code", "summary": "Numbers were only in the titles, so a new session showed none. The source now assigns numbers in the plugin, but the installed copy is older: it reads `parseTasks(e.input)`, while the source had `parseTasks(e)`. The source was edited to match, and the plugin is not yet updated. The change was not run.", "evidence": "`diff my-mods/.../register.tsx plugins/cache/.../register.tsx` → line 61 differs.", "upstream": "no", "next step": "Update the plugin from `/plugin`, then check the numbers in a new session.", "resolved": "2026-11-13"}, {"id": "A-025", "title": "Class lookup with a String answers false silently", "source": "Archive", "archived": true, "status": "done", "area": "agent workflow, Pharo image checks", "type": "friction", "found": "2026-11-10, Claude Code", "summary": "`Smalltalk globals includesKey:` with a String argument answers `false` for classes that exist. I reported the CSS and HTML tests as missing, and that was wrong. They exist and pass.", "evidence": "`Smalltalk globals includesKey: 'FASTCSSImporterTest'` gives `false`; with `#FASTCSSImporterTest` it gives `true`. `FASTCSSImporterTest buildSuite run` gives `38 ran, 38 passed`.", "upstream": "no", "resolved": "2026-11-10", "next step": "Use symbols for class lookups in the image."}, {"id": "U-001", "title": "Set up skills across Claude Code and opencode", "source": "Archive", "archived": true, "status": "done", "area": "`ai-agents-resources/skills/`", "type": "improvement", "summary": "One folder of personal skills, linked into both tools. `make-skill` is the first one.", "next step": "Verify opencode loads it (see `A-002`).", "resolved": "2026-11-13"}, {"id": "U-024", "title": "Kill class annotations", "source": "Archive", "archived": true, "status": "done", "resolved": "2026-11-14", "group": "Commander", "details": "unknown"}, {"id": "U-034", "title": "Remove ClassAnnotation usage in Pharo", "source": "Archive", "archived": true, "status": "done", "resolved": "2026-11-14", "group": "Pharo", "details": "Remove the use of `ClassAnnotation` (`<classAnnotation>` pragmas and the `ClassAnnotation` hierarchy) in Pharo, moving the behaviour it provides to plain class-side methods or other registration mechanisms."}, {"id": "U-041", "title": "Cut dependencies to the ClassAnnotation project and deprecate it", "source": "Archive", "archived": true, "status": "done", "resolved": "2026-11-14", "area": "`ClassAnnotation` project in Pharo", "type": "improvement", "summary": "Remove every dependency on the ClassAnnotation project from the other Pharo projects, then deprecate ClassAnnotation.", "next step": "List the projects that load ClassAnnotation, replace its uses in each, then mark the project deprecated. Related: U-034 removes ClassAnnotation usage in Pharo.", "tags": "Pharo", "difficulty": "hard", "guessed": "Difficulty"}, {"id": "U-047", "title": "Transform my rules on tests into a skill", "source": "Archive", "archived": true, "status": "wontfix", "resolved": "2026-11-16", "area": "`ai-agents-resources/AGENTS.md` (the \"Testing\" rules) and `ai-agents-resources/skills`", "type": "improvement", "summary": "Move my rules on tests out of `AGENTS.md` into a skill, so agents load them only when they write or change tests.", "next step": "Create the skill with `make-skill`, move the testing rules into it, then remove them from `AGENTS.md` and update `setup.sh`.", "tags": "Perso, Claude", "priority": "low", "difficulty": "easy"}, {"id": "A-032", "title": "Hermes exports the method trailer as bytecode, so installed methods cannot be decompiled on Pharo 12+", "source": "Archive", "archived": true, "status": "done", "resolved": "2026-11-16", "area": "`pharo-project/hermes` `HEMethod>>fillLiteralsAndBytecode:` and `HEInstaller>>rebuildMethod:into:`", "type": "bug", "found": "2026-11-15, Claude Code", "summary": "The exporter copies every byte after the literals, including the 5-byte trailer of the source method, and on Pharo 12+ the installer adds a new trailer after it. The installed method runs, but its bytecodes end with the old trailer, so the decompiler fails (and tools showing the code of a method without source show \"Decompilation failed\").", "evidence": "In Pharo 15, installing `HETeSimpleClass` renamed: `(installed >> #otherMethod) bytecodes` → `#(76 128 92 0 0 100 206 121)` against `#(76 128 92)` for the original; `decompile` → `SubscriptOutOfBounds 7`.", "upstream": "yes", "next step": "Fixed: `HEMethod>>fillLiteralsAndBytecode:` exports up to `endPC`, and `HEInstaller>>rebuildMethod:into:` reserves an empty trailer (5 bytes since Pharo 12, 4 before). Test `HEInstallerSimpleTest>>testInstalledMethodsHaveTheBytecodesOfTheOriginalMethods`.", "tags": "Pharo, Hermes", "guessed": "Tags"}, {"id": "A-029", "title": "HermesClapCommand class comment describes the removed HermesCommandLineHandler", "source": "Archive", "archived": true, "status": "done", "resolved": "2026-11-17", "area": "`pharo-project/pharo` `Hermes-Extensions` `HermesClapCommand`", "type": "doc", "found": "2026-11-14, Claude Code", "summary": "The comment starts with \"Class: HermesCommandLineHandler\" and documents `on-duplication=action`, while the command takes `--on-duplication <action>`. `duplicationMode` also turns an unknown action into `fail` silently, although `HEDuplicationModeStrategy class>>forOption:` already reports unknown actions. `HEClassTrait`'s comment names `MetaclassForTrait` instead of `MetaclassForTraits`.", "evidence": "`src/Hermes-Extensions/HermesClapCommand.class.st` lines 1-35 and `duplicationMode`; `src/Hermes/HEClassTrait.class.st` line 2.", "upstream": "yes", "next step": "Rewrite the comments; decide whether an unknown action should fail.", "tags": "Pharo, Hermes", "difficulty": "easy", "priority": "low", "guessed": "Tags, Difficulty, Priority"}, {"id": "A-031", "title": "Running hermes installer tests on Pharo 14+ rewrites HEInstaller>>rebuildMethod:into:", "source": "Archive", "archived": true, "status": "done", "resolved": "2026-11-17", "area": "`pharo-project/hermes` `HEInstaller>>rebuildMethod:into:`, Pharo deprecation transformations", "type": "friction", "found": "2026-11-14, Claude Code", "summary": "`CompiledCode class>>newMethod:header:` is deprecated with an automatic rewrite in Pharo 14+, so running any hermes installer test in a Pharo 15 image silently rewrites the caller `HEInstaller>>rebuildMethod:into:` to `basicNew:header:`, which then shows up as an unexpected change in Iceberg. It happened twice in one session.", "evidence": "Iceberg diff of the hermes repository listing `Hermes HEInstaller rebuildMethod:into:` after `test_run` of `HEInstallerSimpleTest`.", "upstream": "yes", "next step": "Disappears once hermes uses `basicNew:header:` on Pharo 12+ (Pharo 14 compatibility step). Until then, check the Iceberg diff after running installer tests on Pharo 14+ and restore the method.", "tags": "Pharo, Hermes", "priority": "low", "difficulty": "medium", "guessed": "Tags, Priority, Difficulty"}, {"id": "A-033", "title": "Hermes-Ring2 overrides RGEnvironment>>packages of Ring-Core", "source": "Archive", "archived": true, "status": "done", "resolved": "2026-11-17", "area": "`pharo-project/hermes` `Hermes-Ring2` (`RGEnvironment.extension.st`), `pharo-project/pharo` Ring-Core", "type": "bug", "found": "2026-11-16, Claude Code", "summary": "`Hermes-Ring2` defines `RGEnvironment>>packages` (`^ self ask packages`) as an extension, but Ring-Core already defines it (`^ packages`). Loading hermes in a Pharo image replaces the Ring-Core method, which shows as a removal in the pharo repository and changes Ring for every user of the image, including the bootstrap host. The hermes tests pass on Pharo 15 with the Ring-Core version.", "evidence": "Iceberg diff of the pharo repository after loading hermes: `IceRemoval Ring-Core RGEnvironment packages`; `Hermes-Tests` and `Hermes-Tests-Ring` pass (90 tests) after restoring the Ring-Core method.", "upstream": "yes", "next step": "Check why the override was added (git log of hermes), remove it if not needed on Pharo 10 to 15 (CI), or rename it.", "tags": "Pharo, Hermes", "priority": "low", "difficulty": "easy", "guessed": "Tags, Priority, Difficulty"}, {"id": "U-033", "title": "Fix file browser presenter in Pharo", "source": "Archive", "archived": true, "status": "done", "group": "none", "details": "unknown", "tags": "Pharo", "guessed": "Tags", "resolved": "2026-11-17"}, {"id": "U-039", "title": "Toolbar utility listing my tasks in pharo-scripts", "source": "Archive", "archived": true, "status": "wontfix", "area": "`pharo-scripts`", "type": "improvement", "summary": "Add a toolbar utility in pharo-scripts that lists my tasks, so I can see them from the Pharo image.", "next step": "Decide where the tasks come from (the user backlog file or a shared source), then add the toolbar button and the list.", "tags": "Perso", "priority": "low", "difficulty": "medium", "guessed": "Difficulty", "resolved": "2026-11-17"}, {"id": "U-055", "title": "Add meta tasks and sub tasks", "source": "Archive", "archived": true, "status": "done", "area": "Backlog format (`backlog/README.md`), backlog view (`build-view.py`)", "type": "improvement", "summary": "Group several tasks under one common goal, with meta tasks holding sub tasks.", "next step": "Decide how a sub task points to its meta task (a `Parent` field), then update the format, the view and the backlog commands.", "tags": "Perso, Claude", "priority": "low", "difficulty": "medium", "parent": "U-060", "guessed": "Type, Area", "resolved": "2026-11-17"}, {"id": "U-004", "title": "Skill about general collection of thing to do", "source": "Archive", "archived": true, "status": "done", "group": "none", "details": "unknown", "tags": "Claude", "type": "improvement", "parent": "U-060", "guessed": "Tags, Type", "resolved": "2026-11-17"}, {"id": "U-036", "title": "Tags on tasks", "source": "Archive", "archived": true, "status": "done", "group": "Claude plugin", "details": "Add tags to the tasks, so that tasks can be labelled and filtered.", "tags": "Claude, Perso", "difficulty": "medium", "parent": "U-059", "guessed": "Tags, Difficulty", "resolved": "2026-11-17"}, {"id": "U-046", "title": "Merge the task-list plugin and the task-tabs mod", "source": "Archive", "archived": true, "status": "done", "area": "`ai-agents-resources/claude/task-list` (plugin `task-list@cyril-mods`) and `~/.claude/mods/task-tabs`", "type": "improvement", "summary": "Two separate side panes show the session tasks: the task-list plugin's \"Tasks\" pane (owns `set_tasks` and `/tasks`) and the \"Session tasks\" tab of task-tabs, which copies the list and has no command to reopen it. Merge them into one mod with the three tabs (session tasks, my backlog, Claude backlog), one command to reopen them all, and the task-tabs mod moved into `ai-agents-resources` with `setup.sh` updated.", "next step": "Move the `set_tasks` tool, its numbering and `/tasks` into task-tabs, make `/backlog` (or `/tasks`) reopen every tab, then remove the task-list plugin from `settings.json` and the marketplace.", "tags": "Perso, Claude", "priority": "low", "difficulty": "easy", "parent": "U-059", "resolved": "2026-11-17"}, {"id": "U-043", "title": "Colors in the Pharo launcher for the last modified column", "source": "Archive", "archived": true, "status": "done", "area": "Pharo launcher, last modified column", "type": "improvement", "summary": "Add colors to the last modified column of the Pharo launcher so recent and old images are easy to tell apart.", "next step": "Find where the launcher draws the last modified column, then choose colors that stay readable in the launcher's themes.", "tags": "pharo-launcher", "priority": "low", "difficulty": "easy", "parent": "U-065", "resolved": "2026-11-18"}, {"id": "U-066", "title": "Test the new Morphic launcher", "source": "Archive", "archived": true, "status": "done", "area": "pharo-launcher", "type": "improvement", "summary": "Test the new Morphic launcher.", "next step": "Decide the first step, then do it.", "tags": "pharo-launcher", "difficulty": "easy", "priority": "high", "parent": "U-065", "guessed": "Area, Type", "resolved": "2026-11-18"}];
const tabNames = ["Cross-session tasks", "Claude tasks", "Archive"];
const filterIdentifiers = ["search", "source", "status", "tag", "priority", "difficulty"];
const savedFilterKey = "backlog-view-filters";
const allValue = "";
const rankings = {
	priority: { low: 1, medium: 2, high: 3 },
	difficulty: { easy: 1, medium: 2, hard: 3 }
};
const statusColors = { open: "#3b7fd1", "in-progress": "#d69a0b", "waiting-review": "#8a58d6", done: "#2e9e4f", wontfix: "#8a8a85" };
const priorityColors = { low: "#2e9e4f", medium: "#d69a0b", high: "#d64545" };
const difficultyColors = { easy: "#2e9e4f", medium: "#d69a0b", hard: "#d64545" };
const tagColors = {
	pharo: "#2e9e4f",
	perso: "#e0801c",
	moose: "#3b7fd1",
	documentation: "#d6509a",
	mcp: "#8a58d6",
	claude: "#5a64d6",
	telescope: "#1f9aa0"
};
const fallbackColors = ["#0f9fb0", "#a8862b", "#b5472b", "#6b8e23", "#7a5c3e", "#c24f8a"];
let sortState = { key: "id", direction: "asc" };
let expandedIds = new Set();
let collapsedIds = new Set();
let savedScroll = null;
const hiddenDetailFields = ["id", "title", "source", "archived"];

function splitTags(entry) {
	return (entry.tags || "").split(",").map(tag => tag.trim()).filter(tag => tag.length > 0);
}

function tagColor(tag) {
	const key = tag.toLowerCase();
	if (tagColors[key]) return tagColors[key];
	let hash = 0;
	for (const character of key) hash += character.charCodeAt(0);
	return fallbackColors[hash % fallbackColors.length];
}

function colorFor(key, value) {
	const colorTables = { status: statusColors, priority: priorityColors, difficulty: difficultyColors };
	return (colorTables[key] || {})[value] || "#8a8a85";
}

function makePill(text, color) {
	const pill = document.createElement("span");
	pill.className = "pill";
	pill.style.setProperty("--pill", color);
	pill.textContent = text;
	return pill;
}

function distinctValues(key) {
	const values = new Set();
	entries.forEach(entry => {
		if (key === "tags") {
			splitTags(entry).forEach(tag => values.add(tag));
		} else if (entry[key]) {
			values.add(entry[key]);
		}
	});
	return [...values].sort((first, second) => first.localeCompare(second));
}

function fillSourceSelect(element) {
	element.innerHTML = "";
	tabNames.forEach(name => element.add(new Option(name, name)));
}

function fillSelect(element, label, values) {
	element.innerHTML = "";
	element.add(new Option("All " + label, allValue));
	values.forEach(value => element.add(new Option(value, value)));
}

function renderTabs() {
	const container = document.getElementById("tabs");
	const selected = document.getElementById("source").value;
	container.innerHTML = "";
	tabNames.forEach(name => {
		const button = document.createElement("button");
		button.className = "tab";
		button.setAttribute("role", "tab");
		button.setAttribute("aria-selected", String(name === selected));
		button.textContent = name;
		button.addEventListener("click", () => {
			document.getElementById("source").value = name;
			saveFilters();
			render();
		});
		container.appendChild(button);
	});
}

function currentFilters() {
	return {
		search: document.getElementById("search").value.trim().toLowerCase(),
		source: document.getElementById("source").value,
		status: document.getElementById("status").value,
		tag: document.getElementById("tag").value,
		priority: document.getElementById("priority").value,
		difficulty: document.getElementById("difficulty").value
	};
}

function matches(entry, filters) {
	if (filters.source && entry.source !== filters.source) return false;
	if (filters.status && entry.status !== filters.status) return false;
	if (filters.tag && !splitTags(entry).includes(filters.tag)) return false;
	if (filters.priority && entry.priority !== filters.priority) return false;
	if (filters.difficulty && entry.difficulty !== filters.difficulty) return false;
	if (filters.search) {
		const haystack = [entry.id, entry.title, entry.summary, entry.area, entry.tags].join(" ").toLowerCase();
		if (!haystack.includes(filters.search)) return false;
	}
	return true;
}

function sortKey(entry, key) {
	if (rankings[key]) return rankings[key][entry[key]] || 99;
	if (key === "id") return entry.id.charAt(0) + entry.id.slice(2).padStart(4, "0");
	if (key === "tags") return (splitTags(entry)[0] || "").toLowerCase();
	return (entry[key] || "").toLowerCase();
}

function compareEntries(first, second) {
	const firstKey = sortKey(first, sortState.key);
	const secondKey = sortKey(second, sortState.key);
	let order = 0;
	if (firstKey < secondKey) order = -1;
	if (firstKey > secondKey) order = 1;
	return sortState.direction === "asc" ? order : -order;
}

function tagCell(entry) {
	const cellElement = document.createElement("td");
	splitTags(entry).forEach(tag => {
		const button = makePill(tag, tagColor(tag));
		button.setAttribute("role", "button");
		button.title = "Filter on " + tag;
		button.addEventListener("click", () => filterOnPill("tag", tag));
		cellElement.appendChild(button);
	});
	return cellElement;
}

function filterOnPill(filterIdentifier, value) {
	const selector = document.getElementById(filterIdentifier);
	selector.value = selector.value === value ? allValue : value;
	saveFilters();
	render();
}

function coloredCell(key, value) {
	const cellElement = document.createElement("td");
	if (value) {
		const pill = makePill(value, colorFor(key, value));
		pill.setAttribute("role", "button");
		pill.title = "Filter on " + value;
		pill.addEventListener("click", () => filterOnPill(key, value));
		cellElement.appendChild(pill);
	}
	return cellElement;
}

function plainCell(text, className) {
	const cellElement = document.createElement("td");
	cellElement.textContent = text || "";
	if (className) cellElement.className = className;
	return cellElement;
}

function updateHeaders() {
	document.querySelectorAll("th.sortable").forEach(header => {
		const label = header.textContent.replace(/ [▲▼]$/, "");
		const active = header.dataset.key === sortState.key && !isUnsorted();
		header.textContent = active ? label + (sortState.direction === "asc" ? " ▲" : " ▼") : label;
	});
}

const writeServiceAddress = "http://127.0.0.1:8765/status";

function setStatus(identifier, status, message) {
	message.textContent = "Saving...";
	fetch(writeServiceAddress, {
		method: "POST",
		headers: { "Content-Type": "application/json" },
		body: JSON.stringify({ id: identifier, status: status })
	}).then(response => response.json().then(body => {
		if (!response.ok) throw new Error(body.error || "request failed");
		message.textContent = identifier + " marked " + status + ".";
		render();
	})).catch(error => {
		message.textContent = "Not saved: " + error.message + ". Is the watcher running (launch agent com.cyril.backlog-view)?";
	});
}

function actionRow(entry) {
	const actions = document.createElement("div");
	actions.className = "actions";
	const message = document.createElement("span");
	message.className = "action-message";
	[["open", "Open"], ["in-progress", "In progress"], ["waiting-review", "Waiting review"], ["done", "Done"], ["wontfix", "Won't fix"]].forEach(([status, label]) => {
		const button = document.createElement("button");
		button.className = "action";
		button.textContent = label;
		button.disabled = entry.status === status;
		button.addEventListener("click", () => setStatus(entry.id, status, message));
		actions.appendChild(button);
	});
	actions.appendChild(message);
	return actions;
}

function detailRow(entry) {
	const row = document.createElement("tr");
	row.className = "details";
	const cellElement = document.createElement("td");
	cellElement.colSpan = 6;
	cellElement.appendChild(actionRow(entry));
	const list = document.createElement("dl");
	list.className = "details";
	Object.keys(entry).filter(key => !hiddenDetailFields.includes(key)).forEach(key => {
		const term = document.createElement("dt");
		term.textContent = key;
		const description = document.createElement("dd");
		description.textContent = entry[key];
		list.appendChild(term);
		list.appendChild(description);
	});
	cellElement.appendChild(list);
	row.appendChild(cellElement);
	return row;
}

function toggleEntry(identifier) {
	if (expandedIds.has(identifier)) {
		expandedIds.delete(identifier);
	} else {
		expandedIds.add(identifier);
	}
	saveFilters();
	render();
}

function childrenOf(parentIdentifier, visibleEntries) {
	return visibleEntries.filter(entry => entry.parent === parentIdentifier);
}

function isClosed(entry) {
	return entry.status === "done" || entry.status === "wontfix";
}

function progressBar(children) {
	const closed = children.filter(isClosed).length;
	const percentage = Math.round((closed / children.length) * 100);
	const wrapper = document.createElement("span");
	wrapper.className = "progress";
	wrapper.title = closed + " of " + children.length + " subtasks closed";
	const track = document.createElement("span");
	track.className = "progress-track";
	const fill = document.createElement("span");
	fill.className = "progress-fill";
	fill.style.width = percentage + "%";
	track.appendChild(fill);
	const label = document.createElement("span");
	label.className = "progress-label";
	label.textContent = closed + "/" + children.length;
	wrapper.appendChild(track);
	wrapper.appendChild(label);
	return wrapper;
}

function appendEntryRows(body, entry, depth, visibleEntries, visibleIds) {
	const children = childrenOf(entry.id, visibleEntries);
	const row = document.createElement("tr");
	row.className = "entry";
	row.addEventListener("click", event => {
		if (event.target.closest(".pill, .toggle")) return;
		toggleEntry(entry.id);
	});
	const titleCell = plainCell("");
	titleCell.style.paddingLeft = (10 + depth * 22) + "px";
	if (children.length > 0) {
		const toggle = document.createElement("span");
		toggle.className = "toggle";
		toggle.textContent = collapsedIds.has(entry.id) ? "▸ " : "▾ ";
		toggle.addEventListener("click", () => toggleCollapse(entry.id));
		titleCell.appendChild(toggle);
	}
	titleCell.appendChild(document.createTextNode(entry.title));
	const allChildren = entries.filter(child => child.parent === entry.id);
	if (allChildren.length > 0) {
		titleCell.classList.add("meta-title");
		titleCell.appendChild(progressBar(allChildren));
	}
	if (entry.summary) titleCell.title = entry.summary;
	const idCell = plainCell(entry.id, "id");
	row.appendChild(idCell);
	row.appendChild(titleCell);
	row.appendChild(coloredCell("status", entry.status));
	row.appendChild(tagCell(entry));
	row.appendChild(coloredCell("priority", entry.priority));
	row.appendChild(coloredCell("difficulty", entry.difficulty));
	body.appendChild(row);
	if (expandedIds.has(entry.id)) body.appendChild(detailRow(entry));
	if (!collapsedIds.has(entry.id)) {
		children.forEach(child => appendEntryRows(body, child, depth + 1, visibleEntries, visibleIds));
	}
}

function render() {
	const filters = currentFilters();
	const visible = entries.filter(entry => matches(entry, filters)).sort(compareEntries);
	const visibleIds = new Set(visible.map(entry => entry.id));
	const roots = visible.filter(entry => !entry.parent || !visibleIds.has(entry.parent));
	const body = document.getElementById("rows");
	body.innerHTML = "";
	roots.forEach(entry => appendEntryRows(body, entry, 0, visible, visibleIds));
	renderTabs();
	updateHeaders();
	document.getElementById("count").textContent = visible.length + " of " + entries.length + " entries";
	document.getElementById("empty").hidden = visible.length > 0;
}

function toggleCollapse(identifier) {
	if (collapsedIds.has(identifier)) {
		collapsedIds.delete(identifier);
	} else {
		collapsedIds.add(identifier);
	}
	saveFilters();
	render();
}

function sortBy(key) {
	if (sortState.key !== key) {
		sortState = { key: key, direction: "asc" };
	} else if (sortState.direction === "asc") {
		sortState = { key: key, direction: "desc" };
	} else {
		sortState = { key: unsortedState.key, direction: unsortedState.direction };
	}
	saveFilters();
	render();
}

function loadSavedFilters() {
	try {
		return JSON.parse(localStorage.getItem(savedFilterKey)) || {};
	} catch (error) {
		return {};
	}
}

function saveFilters() {
	const saved = { sort: sortState, expanded: [...expandedIds], collapsed: [...collapsedIds], scroll: window.scrollY };
	filterIdentifiers.forEach(identifier => saved[identifier] = document.getElementById(identifier).value);
	try {
		localStorage.setItem(savedFilterKey, JSON.stringify(saved));
	} catch (error) {
		return;
	}
}

function restoreFilters() {
	const saved = loadSavedFilters();
	filterIdentifiers.forEach(identifier => {
		if (saved[identifier] !== undefined) {
			document.getElementById(identifier).value = saved[identifier];
		}
	});
	if (saved.sort && saved.sort.key) sortState = saved.sort;
	if (Array.isArray(saved.expanded)) expandedIds = new Set(saved.expanded);
	if (Array.isArray(saved.collapsed)) collapsedIds = new Set(saved.collapsed);
	if (typeof saved.scroll === "number") savedScroll = saved.scroll;
}

function setup() {
	fillSourceSelect(document.getElementById("source"));
	fillSelect(document.getElementById("status"), "statuses", distinctValues("status"));
	fillSelect(document.getElementById("tag"), "projects and tags", distinctValues("tags"));
	fillSelect(document.getElementById("priority"), "priorities", distinctValues("priority"));
	fillSelect(document.getElementById("difficulty"), "difficulties", distinctValues("difficulty"));
	restoreFilters();
	let scrollTimer = null;
	window.addEventListener("scroll", () => {
		clearTimeout(scrollTimer);
		scrollTimer = setTimeout(saveFilters, 200);
	});
	if (!tabNames.includes(document.getElementById("source").value)) {
		document.getElementById("source").value = tabNames[0];
	}
	document.querySelectorAll("input, select").forEach(element => element.addEventListener("input", () => {
		saveFilters();
		render();
	}));
	document.querySelectorAll("select").forEach(element => element.addEventListener("change", () => {
		saveFilters();
		render();
	}));
	document.querySelectorAll("th.sortable").forEach(header => header.addEventListener("click", () => sortBy(header.dataset.key)));
	render();
	if (savedScroll !== null) window.scrollTo(0, savedScroll);
}

setup();
</script>
</body>
</html>
